<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ararat Morse</title>
    <meta name="description" content="Convert text to and from Morse code in Kurdish, English and more, play it as sound or light, and practise copying it."/>
    <meta name="theme-color" content="#000000"/>
    <base href="/" />

    <link href="manifest.webmanifest" rel="manifest"/>
    <link href="icons/icon.svg" rel="icon" type="image/svg+xml"/>
    <link href="icons/favicon-32.png" rel="icon" type="image/png" sizes="32x32"/>
    <link href="icons/apple-touch-icon.png" rel="apple-touch-icon"/>
    <link as="style"
          href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap"
          onload="this.onload=null;this.rel='stylesheet'" rel="preload">
    <link href="css/app.css" rel="stylesheet"/>
</head>

<body class="bg-black">
    <div id="app">
        <div class="splash" role="status" aria-label="Loading Ararat Morse">
            <svg class="splash-logo" viewBox="0 0 100 100" aria-hidden="true">
                <polygon points="36,26 14,64 56,64"/>
                <polygon points="68,36 48,64 84,64"/>
                <rect class="splash-key" style="--i:0" x="14" y="72" width="18" height="8" rx="4"/>
                <circle class="splash-key" style="--i:1" cx="41" cy="76" r="4"/>
                <rect class="splash-key" style="--i:2" x="53" y="72" width="18" height="8" rx="4"/>
                <circle class="splash-key" style="--i:3" cx="80" cy="76" r="4"/>
            </svg>
            <span class="splash-title">Ararat Morse</span>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/Audio.js" type="text/javascript"></script>
    <script src="js/Sheets.js" type="text/javascript"></script>
    <script src="js/Tooltips.js" type="text/javascript"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
