name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a deploy that's still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install the wasm-tools workload (AOT)
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish ./AraratMorse/AraratMorse.csproj -c Release -o release --nologo

      # Pages serves a project site from /<repository>/, so the base href has to name it. The grep
      # fails the job if the tag was reformatted and the sed no longer matches.
      - name: Point the base href at /${{ github.event.repository.name }}/
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' release/wwwroot/index.html
          grep -q '<base href="/${{ github.event.repository.name }}/" />' release/wwwroot/index.html

      # Pages has no SPA fallback, so a refresh or a shared link to /koch would 404. Serving the app
      # as the 404 page makes it boot anyway and route itself. The precompressed copies of the
      # old index.html no longer match, so they go.
      - name: Serve the app for unknown paths
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          rm -f release/wwwroot/index.html.br release/wwwroot/index.html.gz

      - name: Disable Jekyll
        run: touch release/wwwroot/.nojekyll

      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: release/wwwroot
